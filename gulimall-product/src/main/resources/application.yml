spring:
  cloud:
      # 文件上传秘钥
    alicloud:
      access-key: 11#
      secret-key: 11#
      oss:
        endpoint: oss-cn-hangzhou.aliyuncs.com
#      sentinel:
#        transport:
#          dashboard: localhost:8080

#  zipkin:
#    base-url: http://localhost:9411
#    sender:
#      type: web
#    discovery-client-enabled: false
  #采样取值介于 0到1之间，1则表示全部收集
  sleuth:
    sampler:
      probability: 1
#    enabled: false

  thymeleaf:
    cache: false
  cache:
    type: redis
    redis:
      time-to-live: 3600000
  session:
    store-type: redis
  redis:
    host: 192.168.56.10



mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 10000
  servlet:
    session:
      timeout: 30m

logging:
  level:
    io.niceseason.gulimall.product.dao: error

# 自定义线程池参数
gulimall:
  thread:
    corePoolSize: 10
    maxPoolSize: 20
    keepAliveTime: 300

management:
  endpoints:
    web:
      exposure:
        include: '*'
feign:
  sentinel:
    enabled: true

